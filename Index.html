<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090912">
    <title>Chronos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <div>
            <h1>CHRONOS</h1>
            <p>Personal Assistant</p>
        </div>

        <div id="status">READY</div>
    </header>

    <div class="orb" id="orb">
        <span>CHRONOS</span>
    </div>

    <div class="chat" id="chat">
        <div class="message chronos">
            Hello. I'm Chronos.
        </div>

        <div class="message chronos">
            How can I help you?
        </div>
    </div>

    <div class="panel">

        <div class="timer">
            <small>STOPWATCH</small>
            <strong id="stopwatch">00:00:00</strong>

            <button onclick="startStopwatch()">START</button>
            <button onclick="stopStopwatch()">STOP</button>
            <button onclick="resetStopwatch()">RESET</button>
        </div>

        <div class="timer">
            <small>TIMER</small>
            <strong id="countdown">00:00</strong>

            <button onclick="startTimer(60)">1 MIN</button>
            <button onclick="startTimer(300)">5 MIN</button>
            <button onclick="resetTimer()">RESET</button>
        </div>

    </div>

    <button class="talk" id="micButton">
        🎙️ Talk to Chronos
    </button>

    <button class="backup" id="backupButton">
        🛠️ Backup Mode
    </button>

    <div class="input">
        <input
            id="textInput"
            type="text"
            placeholder="Talk to Chronos..."
        >

        <button id="sendButton">SEND</button>
    </div>

    <footer>Chronos V1</footer>

</div>

<script src="script.js"></script>

</body>
</html>
